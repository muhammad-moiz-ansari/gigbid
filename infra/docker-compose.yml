name: gigbid-local-foundation
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gigbid
      POSTGRES_DB: gigbid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U gigbid -d gigbid"]
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment: &api_environment
      DATABASE_URL: postgresql+psycopg://gigbid:${POSTGRES_PASSWORD}@postgres/gigbid
      CHECKPOINT_URL: postgresql://gigbid:${POSTGRES_PASSWORD}@postgres/gigbid
      WEB_ORIGIN: http://localhost:3000
      MARKETPLACE_MODE: mock
      QUEUE_MODE: database
      REDIS_URL: redis://redis:6379/0
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment: *api_environment
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
