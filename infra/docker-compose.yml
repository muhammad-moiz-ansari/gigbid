name: gigbid-local-foundation
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gigbid
      POSTGRES_DB: gigbid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U gigbid -d gigbid"]
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  # Embeddings stay on an open model served locally; hosted models handle generation.
  ollama:
    image: ollama/ollama:0.40.15
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 10
  ollama-pull:
    image: ollama/ollama:0.40.15
    environment:
      OLLAMA_HOST: ollama:11434
    command: [pull, nomic-embed-text]
    depends_on:
      ollama:
        condition: service_healthy
  migrate:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment: &api_environment
      DATABASE_URL: postgresql+psycopg://gigbid:${POSTGRES_PASSWORD}@postgres/gigbid
      CHECKPOINT_URL: postgresql://gigbid:${POSTGRES_PASSWORD}@postgres/gigbid
      WEB_ORIGIN: http://localhost:3000
      MARKETPLACE_MODE: mock
      QUEUE_MODE: celery
      REDIS_URL: redis://redis:6379/0
      MODEL_PROFILE: ${MODEL_PROFILE:-open}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_URL: http://ollama:11434
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment: *api_environment
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment: *api_environment
    command: [celery, -A, worker.tasks, worker, --loglevel=info]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
  beat:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment: *api_environment
    command: [celery, -A, worker.tasks, beat, --loglevel=info]
    depends_on:
      redis:
        condition: service_healthy
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  ollama_data:
