      Hi, your post says agents rewrite most of the replies your current AI tool suggests, and that order details cannot leave your systems. I have hit that wall before. My suggestion: take a year of resolved tickets, mask personal data, and teach an open-weight model that you host yourselves to do two things, pick the right queue and draft a reply in your tone. Week 1 is a baseline: I measure how your current rules route and how much agents edit drafts, so we judge the new model on your numbers, not mine. Weeks 2-4: training and evaluation on held-out tickets. Weeks 5-6: a private endpoint on a single GPU, with a switch back to the old flow. Could I get a sample of 500 anonymised tickets this week? Darian

  # Anchor project 3: Corrigan-Vale document intake, told three ways.
  - source: aiml-docflow-case.md
    type: case_study
    project: Corrigan-Vale document intake
    skills: [Python, LLM, Document Processing, Redis]
    implied: [OCR, Celery]
    date: "2024-09-18"
    industry: logistics
    text: |
      Case study: paperwork intake for Corrigan-Vale Freight.
      The back office retyped about 9,000 delivery notes, bills of lading and customs forms a day. I built a pipeline that turns each scanned page into text, stamps and handwritten weights included, then has an LLM fill a strict JSON schema: consignee, references, weights, dates and signatures. Fields below a confidence threshold go to a small review screen instead of straight into their transport management system. Throughput comes from a pool of Python workers pulling tasks from a Redis broker, with automatic retries, late acknowledgement so a crash never loses a page, and a beat schedule that re-queues stuck documents every 15 minutes. Result: 94% of fields filled with no human touch, and review time per document fell from 4 minutes to 40 seconds.

  - source: aiml-docflow-readme.md
    type: repository
    project: Corrigan-Vale document intake
    skills: [Python, Redis, Pydantic, Tesseract]
    implied: [Celery, OCR]
    date: "2024-07-30"
    industry: logistics
    text: |
      intake-workers: extraction workers for the Corrigan-Vale paperwork pipeline.
      The API stores each upload and publishes one message per page; workers consume them from Redis, so scaling means starting more worker processes on any box. Pages are read with Tesseract plus a layout model, then the LLM fills the Consignment schema and Pydantic validates it.
      ```python
      @app.task(bind=True, autoretry_for=(TimeoutError,), retry_backoff=True, max_retries=5, acks_late=True)
      def extract_fields(self, page_id):
          fields = llm_fill(read_page(page_id), schema=Consignment)
          return Consignment.model_validate(fields).model_dump()
      app.conf.beat_schedule = {"requeue-stuck": {"task": "intake.requeue", "schedule": 900.0}}
      ```
      Local run: `make broker && make workers N=4`.

