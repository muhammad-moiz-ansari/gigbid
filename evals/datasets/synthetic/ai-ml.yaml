  # Anchor project 1: Pellmont policy assistant, told three ways.
  - source: aiml-claimwise-case.md
    type: case_study
    project: Pellmont policy assistant
    skills: [Python, RAG, LLM, FastAPI]
    date: "2025-03-20"
    industry: insurance
    text: |
      Case study: policy-wording assistant for Pellmont Mutual.
      Claims handlers spent up to 20 minutes per call hunting through 4,100 policy wordings and endorsements spread over three systems. I built a question-answering assistant that finds the relevant clauses, answers in plain English and cites the clause number and document version behind every statement. Retrieval mixes keyword and semantic search over a vector database, adds a reranking step, and filters by product line and policy year. Before launch we wrote a 300-question test set from real handler queries: grounded-answer accuracy rose from 61% with their previous vendor bot to 88%, and unsupported answers fell below 3%. Delivered as a FastAPI service on their intranet, with audit logs. Eight weeks, fixed price.

  - source: aiml-claimwise-readme.md
    type: repository
    project: Pellmont policy assistant
    skills: [Python, Qdrant, Hybrid Search, Reranking]
    implied: [RAG]
    date: "2025-02-14"
    industry: insurance
    text: |
      policy-qa: the retrieval service behind the Pellmont assistant.
      Ingest splits every wording into clause-sized chunks, keeps headings as metadata, embeds them with bge-small and stores them in Qdrant with payload fields for product, year and tenant. A query runs BM25 and dense search in parallel, fuses the lists with reciprocal rank fusion, and a cross-encoder reranks the top 30. The answer step must quote clause ids; a response without a valid id is rejected and regenerated.
      ```yaml
      vector_store: {kind: qdrant, collection: wordings_v3, hnsw_ef: 128}
      retrieval: {sparse: bm25, dense_k: 40, fusion: rrf, rerank_top: 30}
      reranker: BAAI/bge-reranker-base
      chunking: {max_tokens: 450, overlap: 60, split_on: clause_heading}
      ```
      Run `make eval` to score the 300-question set.

  - source: aiml-claimwise-review.md
    type: review
    project: Pellmont policy assistant
    skills: [Chatbot]
    implied: [RAG]
    date: "2025-04-08"
