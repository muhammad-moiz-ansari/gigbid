  # Anchor project 2: Thimbleworth support model, told three ways.
  - source: aiml-supportllm-case.md
    type: case_study
    project: Thimbleworth support model
    skills: [Python, LLM, Fine-tuning, vLLM, MLflow]
    date: "2025-11-14"
    industry: e-commerce
    text: |
      Case study: a private support model for Thimbleworth Home, an online homeware retailer.
      Agents handled about 1,800 tickets a day; the hosted API they used was costly and, for privacy reasons, could not see order data. I fine-tuned Mistral 7B on 38,000 resolved tickets to do two jobs: route each ticket to one of 14 queues and draft a first reply in the brand's voice. Routing accuracy reached 93% against 81% for their keyword rules, and agents kept 64% of drafts with light edits. Every training run, data snapshot and metric is tracked in MLflow, so any model can be traced back to its data. The merged model is served with vLLM on one rented A10G using 4-bit AWQ weights: about 40 requests per second, p95 under 900 ms.

  - source: aiml-supportllm-readme.md
    type: repository
    project: Thimbleworth support model
    skills: [Python, PyTorch, PEFT, LoRA, Hugging Face]
    implied: [Fine-tuning]
    date: "2025-10-02"
    industry: e-commerce
    text: |
      ticket-adapter: training code for the Thimbleworth routing and reply model.
      Each resolved ticket becomes an instruction pair: customer message plus order context in, queue label and the agent's final reply out. Personal data is masked before export. We train low-rank adapters on Mistral-7B-Instruct with the base weights loaded in 4-bit, so one 24 GB card is enough, then merge the adapter for serving.
      ```python
      bnb = BitsAndBytesConfig(load_in_4bit=True, bnb_4bit_quant_type="nf4")
      lora = LoraConfig(r=16, lora_alpha=32, lora_dropout=0.05, target_modules=["q_proj", "v_proj"])
      base = AutoModelForCausalLM.from_pretrained(BASE, quantization_config=bnb)
      SFTTrainer(model=get_peft_model(base, lora), train_dataset=pairs, args=args).train()
      ```
      `python eval.py --split holdout` reports routing accuracy and how far agents edited each draft.

  - source: aiml-supportllm-proposal.md
    type: proposal
    project: Thimbleworth support model
    skills: [LLM, Customer Support]
    implied: [Fine-tuning]
