  # Standalone items for breadth.
  - source: aiml-agentdesk-readme.md
    type: repository
    project: Halvard lead-triage agent
    skills: [Python, LangGraph, LLM Agents, PostgreSQL]
    date: "2026-04-22"
    industry: energy
    text: |
      lead-desk: a LangGraph agent that triages inbound leads for Halvard Solar's sales team.
      For each web enquiry the graph looks the address up in the CRM, estimates roof size from the quote form, scores the lead and drafts a reply. Nothing is sent until a salesperson approves: the graph pauses before the send node and resumes from a Postgres checkpoint, even after a redeploy. Tool calls are typed, retried on rate limits and logged with the run id.
      ```python
      graph = StateGraph(LeadState)
      graph.add_node("enrich", enrich_from_crm)
      graph.add_node("draft", draft_reply)
      graph.add_edge("enrich", "draft")
      app = graph.compile(checkpointer=PostgresSaver(pool), interrupt_before=["send"])
      ```
      Handles about 300 leads a week; median time to first reply fell from 9 hours to 40 minutes.

  - source: aiml-shelfvision-case.md
    type: case_study
    project: Pennyfold shelf monitoring
    skills: [Computer Vision, PyTorch, YOLOv8, OpenCV]
    implied: [Object Detection]
    date: "2024-03-12"
    industry: retail
    text: |
      Case study: empty-shelf alerts for Pennyfold Markets, a 40-store grocery chain.
      Store staff photograph each aisle twice a day with a fixed tablet rig. I trained a YOLOv8 model to draw a box around every gap on the shelf and every price label, using 3,200 photos we labelled together in two weeks, with heavy augmentation for glare and odd angles. OpenCV handles perspective correction, so each gap maps to a planogram position and becomes a line on a per-aisle restock list. The model is exported to ONNX and runs on the tablet itself, about 120 ms per photo, so nothing waits on store Wi-Fi. On held-out stores gap recall was 0.91 at 0.87 precision, and the lists replaced a 45-minute manual walk.

  - source: aiml-clinicnotes-case.md
    type: case_study
    project: Oakhollow medication extraction
    skills: [Python, NLP, Hugging Face, PyTorch]
    implied: [NER]
    date: "2023-10-09"
    industry: healthcare
    text: |
      Case study: medication lists from discharge letters for Oakhollow Health Network.
      Pharmacists were reconciling prescriptions by reading free-text discharge letters. I trained a token-classification model that tags every drug name, dose, route, frequency and duration in a letter, then links each dose back to its drug so the output is a clean medication list. Two pharmacists annotated 2,400 letters; we measured their agreement first, then fine-tuned a clinical BERT checkpoint with Hugging Face Transformers in PyTorch. Span-level F1 on a held-out hospital was 0.92 for drug names and 0.86 for frequencies. A rule layer maps spellings to formulary codes. It runs inside their network on CPU, about 0.3 seconds per letter, and pharmacists now review only flagged items.

