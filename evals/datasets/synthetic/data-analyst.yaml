  - source: da-fernbrook-marketing-repo.md
    type: repository
    project: Fernbrook acquisition reporting
    skills: [BigQuery, SQL, Looker Studio, Google Analytics]
    date: "2026-03-18"
    industry: education
    text: |
      # fernbrook-acquisition-reporting
      Daily acquisition reporting for Fernbrook Online Academy, an online course provider. GA4 events arrive through the native BigQuery export, and Google Ads and Meta spend land through scheduled transfers. sessions_by_channel.sql credits each enrolment to its last non-direct channel; a scheduled query writes the result to a reporting table that feeds a Looker Studio dashboard with cost per enrolment, ROAS and a 28-day cohort view, emailed to the leadership team each Monday.

      ```sql
      select traffic_source.medium, count(distinct user_pseudo_id) as users,
             countif(event_name = 'purchase') as enrolments
      from `fernbrook.analytics_284.events_*`
      where _table_suffix between '20260101' and '20260131'
      group by 1
      ```

  - source: da-tidewell-tableau-case.md
    type: case_study
    project: Tidewell referral waits
    skills: [Tableau, SQL]
    date: "2023-09-05"
    industry: healthcare
    text: |
      Tidewell Community Clinics, a network of nine outpatient sites, had to show its regional funder how long patients waited from referral to first appointment. I wrote SQL views over the scheduling database (SQL Server) and built a Tableau workbook with a site-by-month heat map, a referral funnel and level-of-detail calculations so medians stayed correct when users filtered by specialty. User filters mean each site manager sees only their own site's figures, and no record-level data leaves the clinic network. A quarterly pack that took two analysts a week became a Tableau dashboard refreshed every Monday from an extract, and the clinics used it to rebalance appointment slots; median wait fell from 34 to 27 days over the next two quarters.

