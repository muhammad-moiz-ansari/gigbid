      Five stars. Before Odalys, month end meant a week of copying exports between workbooks and arguing over which revenue figure was right. She rebuilt the whole process so the board pack refreshes itself, and our controller can now answer margin questions in the meeting instead of promising a follow-up. Along the way she found that partial refunds had been counted twice in our old reports, which explained a gap we had chased for a year. Clear weekly updates, patient when explaining numbers to non-technical colleagues, and the recorded walkthroughs mean we are not dependent on her. We will hire her again for the next phase.
      Finance lead, Larkspur Home Goods

  # Anchor project 2: Pepperpot checkout redesign (case study, repository, won proposal)
  - source: da-pepperpot-case.md
    type: case_study
    project: Pepperpot checkout redesign
    skills: [Python, Statistics, BigQuery]
    implied: [A/B Testing]
    date: "2025-10-27"
    industry: food delivery
    text: |
      Pepperpot Meal Kits had rebuilt checkout as a single page and wanted proof it paid off before retiring the old flow. With the product lead I fixed the rules before launch: accounts were randomly assigned 50/50 on first visit, the deciding metric was orders placed within seven days, and a power calculation set a 16-day minimum run to detect a 0.4-point change. A 10% holdout stayed on the old checkout for a further month to check the gain lasted. In week one the event data in BigQuery showed a 52/48 allocation, which I traced to a caching rule, so those days were excluded. Final read: conversion rose from 3.1% to 3.6% (p = 0.004), basket size was flat and support tickets did not rise. The board got a one-page decision memo.

  - source: da-pepperpot-analysis-repo.md
    type: repository
    project: Pepperpot checkout redesign
    skills: [Python, Pandas, SQL]
    implied: [A/B Testing]
    date: "2025-10-06"
    industry: food delivery
    text: |
      # checkout-readout
      Code used to read out a randomised checkout change at a meal-kit subscription company. extract.sql builds one row per account with its assigned arm, signup cohort and whether it ordered within seven days. readout.py first checks the allocation ratio with a chi-square goodness-of-fit test, then compares conversion between arms with a two-proportion z-test and a bootstrap interval, overall and for new versus returning customers. A CUPED adjustment on pre-period orders cut variance by about 18%.

      ```python
      from statsmodels.stats.proportion import proportions_ztest
      counts = df.groupby("arm")["ordered_7d"].sum()
      nobs = df.groupby("arm")["ordered_7d"].count()
      z_stat, p_value = proportions_ztest(counts, nobs)
      ```

  - source: da-proposal-pepperpot.md
    type: proposal
    project: Pepperpot checkout redesign
    skills: [Statistics, Python]
    implied: [A/B Testing]
    date: "2025-08-18"
    industry: food delivery
    outcome: won
    text: |
      Hi Pepperpot team, you have a new one-page checkout and need to know whether it truly lifts orders or only moves them earlier in the week. Before any data comes in I would agree three things with you: the unit we randomise (accounts rather than sessions, so returning customers always see one flow), the single metric that decides it (orders within seven days), and the run length, taken from a sample-size calculation rather than a calendar date. I would also keep a small group on the old checkout for a few weeks after rollout to see whether the gain holds. You get a one-page decision memo plus the code. Could you share typical weekly checkout traffic so I can confirm how long it needs to run?
      Odalys

  # Anchor project 3: Copperloaf demand planning (case study, repository, review)
  - source: da-copperloaf-case.md
    type: case_study
    project: Copperloaf demand planning
    skills: [Forecasting, BigQuery, Looker Studio]
    date: "2024-06-10"
    industry: food and beverage
    text: |
      Copperloaf Bakery runs 23 shops and was binning about 11% of everything it baked while still selling out of sourdough by noon. I moved two years of till transactions into BigQuery and built daily demand forecasts per shop and product, with bank holidays, school terms and weather as drivers, backtested against the previous 12 weeks (median error 9% at product level). Every afternoon the next day's bake quantities appear in a Looker Studio report that shop managers open on a tablet, with a column for their own adjustments so we can see when local knowledge beats the numbers. After ten weeks waste was down to 6.5% with no increase in early sell-outs.

  - source: da-copperloaf-model-repo.md
    type: repository
    project: Copperloaf demand planning
    skills: [Python, Prophet, Time Series Analysis]
    date: "2024-03-22"
    industry: food and beverage
    text: |
      # bakeplan
      Daily bake-quantity model for a multi-site bakery. One Prophet model per shop and product family with weekly and yearly seasonality, bank holidays, school terms and next-day maximum temperature as an extra regressor. backtest.py runs a rolling-origin evaluation over 12 weeks and reports MAPE and bias per site; a capacity cap stops recommendations exceeding shelf space. Predictions for the next 14 days are written back to a warehouse table each afternoon.

      ```python
      m = Prophet(weekly_seasonality=True, yearly_seasonality=True, holidays=uk_holidays)
      m.add_regressor("max_temp_c")
      m.fit(history[["ds", "y", "max_temp_c"]])
      future = m.make_future_dataframe(periods=14)
      ```

  - source: da-copperloaf-review.md
    type: review
    project: Copperloaf demand planning
    skills: [Demand Planning]
    date: "2024-08-05"
    industry: food and beverage
    text: |
