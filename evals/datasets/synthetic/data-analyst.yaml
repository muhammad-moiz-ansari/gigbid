  # Anchor project 1: Larkspur revenue reporting (case study, repository, review)
  - source: da-larkspur-case.md
    type: case_study
    project: Larkspur revenue reporting
    skills: [dbt, Snowflake, Power BI, SQL]
    date: "2025-03-20"
    industry: e-commerce
    text: |
      Larkspur Home Goods, an online homeware brand handling about 40,000 orders a month, closed its books from fourteen hand-maintained spreadsheets, and finance and marketing never agreed on net revenue. I loaded Shopify orders, refunds and Stripe payouts into Snowflake and rebuilt the logic as dbt models in staging, intermediate and mart layers, with tests on every key. On top sits a Power BI dataset with a revenue bridge, refunds by reason and contribution margin by channel. Net revenue now reconciles to Stripe payouts within 0.3% each month, the month-end close dropped from six working days to two, and a data dictionary defines all 31 metrics. Handover included two recorded training sessions for the finance team.

  - source: da-larkspur-models-repo.md
    type: repository
    project: Larkspur revenue reporting
    skills: [SQL]
    implied: [dbt]
    date: "2025-02-28"
    industry: e-commerce
    text: |
      # homeware-finance-marts
      Transformation layer behind an online homeware retailer's revenue reporting. Raw order, refund and payout tables are renamed and typed in staging/, joined in intermediate/ and published as fct_orders, fct_refunds and dim_products in marts/. Models select from their parents with ref(), so build order follows the dependency graph. YAML schema files assert unique and not_null keys and accepted_values on order status, and a nightly snapshot keeps type-2 history of unit costs so old orders keep the margin they had when sold.

      ```sql
      with lines as (
        select order_id, sum(quantity * unit_price) as gross
        from {{ ref('stg_order_lines') }} group by 1
      )
      select o.order_id, l.gross - coalesce(o.refunded_amount, 0) as net_revenue
      from {{ ref('stg_orders') }} o join lines l using (order_id)
      ```

  - source: da-larkspur-review.md
    type: review
    project: Larkspur revenue reporting
    skills: [Financial Reporting, Power BI]
    date: "2025-04-02"
    industry: e-commerce
