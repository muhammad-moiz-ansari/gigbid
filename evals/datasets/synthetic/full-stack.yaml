      before it is broadcast, and clients that drop and reconnect replay the events they missed.

      ```ts
      io.adapter(createAdapter(pub, sub));
      io.of("/lots").on("connection", (socket) => {
        socket.on("bid:place", (bid, ack) => placeBid(socket, bid).then(ack));
      });
      ```

      Load tested with 2,000 concurrent watchers on a single lot.

