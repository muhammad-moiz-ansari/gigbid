    text: |
      furrowfield-live: real-time bidding rooms for a farm machinery auctioneer. A Node.js and
      TypeScript server uses Socket.IO with the Redis adapter, so any of four instances can accept a
      bid and every watcher sees it within about 150 ms. The server is the only source of truth: each
