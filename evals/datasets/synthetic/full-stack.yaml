    industry: logistics
    text: |
      coldwake-ops: Django REST Framework API, React front end built with Vite, Postgres with PostGIS
      for depots and routes. Position and temperature events reach the browser through Channels
      consumers that broadcast to one group per depot. Carrier integrations are tasks that retry on
      their own:

      ```python
      @shared_task(bind=True, autoretry_for=(CarrierTimeout,), retry_backoff=True, max_retries=5)
